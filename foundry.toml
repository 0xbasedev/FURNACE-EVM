[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache/forge"
libs = ["lib", "node_modules"]
# solc-js shim (see tools/solc); version pinned via package.json "solc".
solc = "tools/solc"
offline = true
evm_version = "cancun"
optimizer = true
# 500 runs: ForgePool (with Seals) must stay under the EIP-170 runtime limit (24,576 B);
# `pnpm forge:sizes` fails the build if any contract in contracts/src exceeds it.
optimizer_runs = 500
bytecode_hash = "none"
# Differential replays snapshot the full state (lots, slices, Seals, tags) after every step;
# the longest custody walk needs more than the default 2^30 test gas.
gas_limit = 4_294_967_296
# Differential tests read vectors generated from furnace.config.ts (pnpm gen); no ffi.
ffi = false
fs_permissions = [{ access = "read", path = "./contracts/test/fixtures" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]

[fuzz]
runs = 512
seed = "0xf1e5"

[invariant]
runs = 128
depth = 64
fail_on_revert = false
