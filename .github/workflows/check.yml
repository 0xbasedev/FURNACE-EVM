name: check
on:
  push:
  pull_request:
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # config hash + JSON mirror, CREATE3 re-derivation, 66-check review suite
      - run: pnpm check
