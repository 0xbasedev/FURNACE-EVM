name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck, config hash + mirror, CREATE3, review suite (66), v5.3.2 tests,
      # generated Solidity freshness, forge build + test (forge and solc from npm)
      - run: pnpm check
